- type: entity
  name: mail capsule
  suffix: Primed
  id: MailCapsulePrimed
  parent: BaseItem
  components:
  - type: PointLight
    color: "#FF0000"
  - type: ThrowingAngle
    angle: 180
  - type: EmbeddableProjectile
    minimumSpeed: 3
    removalTime: 0.5
    offset: -0.15,0.0
    sound: /Audio/Machines/sonar-ping.ogg
  - type: Storage
    grid:
    - 0,0,1,1
    maxItemSize: Small
    openOnActivate: false
  - type: Tag
    tags:
    - MailCapsule
    - Trash
  - type: Sprite
    sprite: _NF/Objects/Misc/mail_capsule.rsi
    layers:
      - state: icon-empty
  - type: Appearance
  - type: ItemMapper
    mapLayers:
      icon-mail:
        whitelist:
          components:
          - Item
    sprite: _NF/Objects/Misc/mail_capsule.rsi
  - type: Dumpable
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20 #excess damage avoids cost of spawning entities.
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:EmptyAllContainersBehaviour
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageOnLand
    damage:
      types:
        Blunt: 9.5
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Machines/sonar-ping.ogg
      params:
        volume: 2
  - type: EmitSoundOnCollide
    sound:
      path: /Audio/Machines/sonar-ping.ogg
      params:
        volume: 2

- type: entity
  name: mail capsule box
  parent: BoxBase
  id: BoxMailCapsulePrimed
  description: A box of primed mail capsules.
  components:
  - type: Storage
    grid:
    - 0,0,4,3
    maxItemSize: Normal
  - type: StorageFill
    contents:
      - id: MailCapsulePrimed
        amount: 10
  - type: Sprite
    layers:
      - state: box

# A bag full of mail capsules, for the ERT mail carrier
- type: entity
  parent: MailBag
  suffix: Capsules
  id: MailBagCapsulePrimed
  components:
  - type: StorageFill
    contents:
      - id: MailCapsulePrimed
        amount: 10
